name: Update ETF Atlas on request
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/update-request.txt'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh ETF records and returns
        env:
          ETF_CSV_URL: https://etfexplorer.com/screener.csv?sort=aum&order=desc
        run: python scripts/update_etf.py
      - name: Publish only after successful validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add US_ETF_Market_Atlas.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ETF data and returns"
            git push
          fi
