name: Verify issuer pages for all ETF tickers
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/issuer-links-request.txt'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover official issuer ETF links
        run: python scripts/verify_issuer_links.py
      - name: Publish verified links only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add US_ETF_Market_Atlas.html
          if ! git diff --cached --quiet; then
            git commit -m "Expand verified official issuer ETF product links"
            git push
          fi
